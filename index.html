<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團點名簿</title>
  <style>
    :root { --primary: #1a73e8; --success: #1e8e3e; --warning: #f29900; --danger: #d93025; --gray: #5f6368; }
    body { font-family: sans-serif; background: #f1f3f4; padding: 10px; color: #3c4043; }
    .card { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: var(--primary); margin-top: 0; }
    .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: var(--gray); font-weight: bold; }
    .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    .section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-club { background: #e8f0fe; color: var(--primary); font-size: 16px; }
    .btn-submit { background: var(--success); color: white; width: 100%; font-size: 18px; }
    .btn-leave { background: var(--warning); color: white; width: 100%; font-size: 18px; }
    .btn-danger { background: #fce8e6; color: var(--danger); width: 100%; margin-top: 10px; border: 1px solid var(--danger); }
    .btn-outline-danger { background: white; color: var(--danger); border: 1px solid var(--danger); padding: 4px 6px; font-size: 11px; border-radius: 4px; }
    .btn-logout { background: #607d8b; color: white; width: 100%; margin-bottom: 15px; }
    .btn-login { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
    
    #uncheckList, #checkedList { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .student-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; border: 1px solid #eee; background: white; border-radius: 6px; font-size: 14px; }
    .student-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    input[type="date"], input[type="password"] { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    .hidden { display: none; }
    #status { text-align: center; margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; min-height: 20px; }
    .msg-success { background-color: #e6f4ea; color: var(--success); }
    .msg-error { background-color: #fce8e6; color: var(--danger); }
    .msg-loading { color: var(--gray); font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <h2>社團點名簿</h2>

  <div id="clubSelection">
    <p style="text-align:center;">請選擇社團：</p>
    <div id="clubBtns" class="btn-grid">讀取中...</div>
  </div>

  <div id="mainPage" class="hidden">
    <div class="btn-grid" style="margin-bottom: 15px;">
      <button onclick="location.reload()" style="background:#eee;">← 更換社團</button>
      <button id="logoutBtn" class="btn-logout hidden" onclick="logout()">登出</button>
    </div>
    
    <h3 id="currentClubDisp" style="text-align:center; margin-top:0;"></h3>

    <!-- 登入區域 -->
    <div id="loginArea" class="section">
      <label><b>點名權限驗證：</b></label>
      <input type="password" id="adminPwd" placeholder="請輸入密碼以進行操作">
      <button class="btn-login" onclick="login()">登入管理模式</button>
    </div>

    <div class="tabs">
      <div id="tab1" class="tab active" onclick="switchTab('take')">點名/請假</div>
      <div id="tab2" class="tab" onclick="switchTab('query')">已點查詢</div>
    </div>

    <div class="section">
      <label><b>上課日期：</b></label>
      <input type="date" id="targetDate" onchange="refreshLists()">
    </div>

    <div id="takeAttendanceArea">
      <div class="section">
        <label><b>尚未處理學生：</b></label>
        <div id="uncheckList"></div>
      </div>
      <div id="actionBtns" class="btn-grid hidden">
        <button id="btnSubmit" class="btn-submit" onclick="submitMulti('submit')">出席點名</button>
        <button id="btnLeave" class="btn-leave" onclick="submitMulti('leave')">學生請假</button>
      </div>
    </div>

    <div id="queryAttendanceArea" class="hidden">
      <div class="section">
        <label><b>名單確認 (*為請假)：</b></label>
        <div id="checkedList"></div>
        <button id="delAllBtn" class="btn-danger hidden" onclick="confirmDeleteAll()">刪除此日期整欄紀錄</button>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxAUZ03sMFdOv_2Z0Ky00lowGNNExFVN0l4gAIUSXUv5lFOy0Hc9-QU2LNKjUTnmX6HDg/exec";
  
  let curClub = "";
  let curMode = "take"; 

  window.onload = () => {
    fetchClubs();
    document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
  };

  async function fetchClubs() {
    try {
      const r = await fetch(`${API_URL}?action=getClubList`);
      const list = await r.json();
      const div = document.getElementById('clubBtns');
      div.innerHTML = "";
      list.forEach(c => {
        let b = document.createElement('button'); b.className = "btn-club";
        b.innerText = c; b.onclick = () => { curClub = c; showMain(); };
        div.appendChild(b);
      });
    } catch(e) { showStatus("連線失敗", "error"); }
  }

  function showMain() {
    document.getElementById('clubSelection').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    document.getElementById('currentClubDisp').innerText = "社團：" + curClub;
    
    // 檢查 LocalStorage 是否已有登入紀錄
    const savedPwd = localStorage.getItem("club_pwd_" + curClub);
    if (savedPwd) {
      document.getElementById('loginArea').classList.add('hidden');
      document.getElementById('actionBtns').classList.remove('hidden');
      document.getElementById('delAllBtn').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
    }
    
    refreshLists();
  }

  async function login() {
    const pwd = document.getElementById('adminPwd').value;
    if (!pwd) return showStatus("請輸入密碼", "error");
    
    showStatus("驗證中...", "loading");
    try {
      const r = await fetch(`${API_URL}?action=verifyPassword&clubName=${encodeURIComponent(curClub)}&password=${pwd}`);
      const res = await r.json();
      if (res.success) {
        localStorage.setItem("club_pwd_" + curClub, pwd);
        document.getElementById('loginArea').classList.add('hidden');
        document.getElementById('actionBtns').classList.remove('hidden');
        document.getElementById('delAllBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        showStatus("登入成功", "success");
        setTimeout(clearStatus, 1500);
        refreshLists();
      } else {
        showStatus("密碼錯誤", "error");
      }
    } catch(e) { showStatus("驗證出錯", "error"); }
  }

  function logout() {
    localStorage.removeItem("club_pwd_" + curClub);
    location.reload();
  }

  function switchTab(m) {
    curMode = m;
    document.getElementById('tab1').className = m === 'take' ? 'tab active' : 'tab';
    document.getElementById('tab2').className = m === 'query' ? 'tab active' : 'tab';
    document.getElementById('takeAttendanceArea').className = m === 'take' ? '' : 'hidden';
    document.getElementById('queryAttendanceArea').className = m === 'query' ? '' : 'hidden';
    clearStatus(); refreshLists();
  }

  async function refreshLists() {
    const date = document.getElementById('targetDate').value;
    if(!curClub || !date) return;
    
    document.getElementById('uncheckList').innerHTML = "<p style='grid-column:span 2;text-align:center;'>載入中...</p>";
    document.getElementById('checkedList').innerHTML = "<p style='grid-column:span 2;text-align:center;'>載入中...</p>";
    
    const isLogged = localStorage.getItem("club_pwd_" + curClub) !== null;

    try {
      const [r1, r2] = await Promise.all([
        fetch(`${API_URL}?action=getStudents&clubName=${encodeURIComponent(curClub)}&date=${date}&mode=unchecked`),
        fetch(`${API_URL}?action=getStudents&clubName=${encodeURIComponent(curClub)}&date=${date}&mode=checked`)
      ]);
      renderList('uncheckList', await r1.json(), 'checkbox', isLogged);
      renderList('checkedList', await r2.json(), 'delete', isLogged);
    } catch(e) { showStatus("讀取失敗", "error"); }
  }

  function renderList(id, data, type, isLogged) {
    const container = document.getElementById(id);
    if (!data.length) {
      container.innerHTML = "<p style='grid-column:span 2;color:gray;text-align:center;font-size:14px;'>無資料</p>";
      return;
    }
    container.innerHTML = "";
    data.forEach(nameText => {
      let d = document.createElement('div'); d.className = "student-row";
      if(type === 'checkbox') {
        // 如果沒登入，隱藏勾選框或禁用
        const chkHtml = isLogged ? `<input type="checkbox" name="stu" value="${nameText}" style="transform:scale(1.2);">` : `<span>(唯讀)</span>`;
        d.innerHTML = `<span>${nameText}</span>${chkHtml}`;
      } else {
        const cleanName = nameText.replace('*', '');
        const delHtml = isLogged ? `<button class="btn-outline-danger" onclick="deleteSingle('${cleanName}')">刪除</button>` : '';
        d.innerHTML = `<span>${nameText}</span>${delHtml}`;
      }
      container.appendChild(d);
    });
  }

  async function callPost(data) {
    const pwd = localStorage.getItem("club_pwd_" + curClub);
    if(!pwd) return showStatus("請先登入", "error");
    
    showStatus("處理中...", "loading");
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({...data, clubName: curClub, password: pwd, date: document.getElementById('targetDate').value})
      });
      const res = await r.json();
      if(res.status === 'success') {
        showStatus(res.message, "success");
        setTimeout(() => { clearStatus(); refreshLists(); }, 1000);
      } else {
        showStatus(res.message, "error");
      }
    } catch(e) { showStatus("操作連線錯誤", "error"); }
  }

  function submitMulti(act) {
    const box = document.querySelectorAll('input[name="stu"]:checked');
    if(!box.length) return showStatus("請勾選學生", "error");
    const stuList = Array.from(box).map(b => b.value);
    callPost({ action: act, students: stuList });
  }

  function deleteSingle(name) {
    if(!confirm("確定刪除 " + name + " 的紀錄嗎？")) return;
    callPost({ action: 'deleteSingle', studentName: name });
  }

  function confirmDeleteAll() {
    if(confirm("確定刪除此日期整欄紀錄嗎？此操作不可還原。")) {
      callPost({ action: 'deleteAll' });
    }
  }

  function showStatus(msg, type) {
    const s = document.getElementById('status'); s.innerText = msg; s.className = "";
    if (type === "success") s.classList.add('msg-success');
    else if (type === "error") s.classList.add('msg-error');
    else s.classList.add('msg-loading');
  }

  function clearStatus() { 
    const s = document.getElementById('status');
    if(s) { s.innerText = ""; s.className = ""; }
  }
</script>

</body>
</html>
